name: Build Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: '05-cards-project/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: 05-cards-project

      - name: Build application
        run: npm run build
        working-directory: 05-cards-project

      - name: Run linter
        run: npm run lint
        working-directory: 05-cards-project
