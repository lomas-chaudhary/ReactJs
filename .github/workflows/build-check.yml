name: Build Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [ '02-folder', '03-components', '04-props', '05-cards-project']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: '${{ matrix.project }}/package-lock.json'

      - name: Check if project directory exists
        id: check_dir
        run: |
          if [ -d "${{ matrix.project }}" ] && [ -f "${{ matrix.project }}/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Install dependencies
        if: steps.check_dir.outputs.exists == 'true'
        run: npm ci
        working-directory: ${{ matrix.project }}

      - name: Build application
        if: steps.check_dir.outputs.exists == 'true'
        run: npm run build
        working-directory: ${{ matrix.project }}

      - name: Run linter
        if: steps.check_dir.outputs.exists == 'true'
        run: npm run lint
        working-directory: ${{ matrix.project }}
